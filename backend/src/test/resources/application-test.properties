# Tests run against their own database and never touch your development data.
# Username and password are inherited from application.properties (DB_PASSWORD env var).
spring.datasource.url=jdbc:mysql://localhost:3306/servicedesk_test
app.security.bcrypt-strength=4
# A fresh random secret per test run, so no secret is ever committed.
# (Only JwtProperties may read this property: every read of ${random.value} yields a new value.)
app.security.jwt.secret=${random.value}${random.value}