spring.application.name=servicedesk

# --- Database (password comes from the DB_PASSWORD environment variable) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/servicedesk}
spring.datasource.username=${DB_USERNAME:servicedesk_app}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# validate: Hibernate checks the schema but never changes it (Flyway will own the schema)
spring.jpa.hibernate.ddl-auto=validate
# Don't hold a DB connection open while controllers render JSON
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Store and read all timestamps as UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC